<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Klinch Overlay</title>
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>

  <!-- Full-screen Ear: top-right HUD (hidden in passive mode) -->
  <div class="ear-fs-topbar" id="ear-fs-topbar">
    <span class="ear-fs-dot" id="ear-fs-dot"></span>
    <button class="ear-fs-minimize-btn" id="ear-fs-minimize-btn" title="Minimize">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 10L10 1"/>
        <path d="M10 10H5M1 5V10"/>
      </svg>
    </button>
  </div>

  <!-- Cue text — center screen (shared between passive and full-screen modes) -->
  <div class="cue-wrap">
    <div class="cue-text" id="cue-text"></div>
  </div>

  <!-- Full-screen Ear: purple bottom glow (hidden in passive mode) -->
  <div class="ear-fs-bottom-glow" id="ear-fs-bottom-glow"></div>

  <!-- Full-screen Ear: attention toast -->
  <div class="ear-fs-toast" id="ear-fs-toast">Klinch Ear is recording</div>

  <!-- Full-screen Ear: bottom controls (hidden in passive mode) -->
  <div class="ear-fs-bottombar" id="ear-fs-bottombar">
    <div class="ear-live-indicator" id="ear-live-indicator">
      <span class="ear-live-dot"></span>LIVE
    </div>
    <button class="ear-fs-btn ear-fs-btn-pause" id="ear-fs-pause">Pause</button>
    <button class="ear-fs-btn ear-fs-btn-resume" id="ear-fs-resume" style="display:none">Resume</button>
    <button class="ear-fs-btn ear-fs-btn-end" id="ear-fs-end">End</button>
    <button class="ear-fs-btn ear-fs-btn-cancel" id="ear-fs-cancel">Cancel</button>
  </div>

  <!-- End session confirmation dialog -->
  <div class="ear-fs-confirm-backdrop" id="ear-fs-confirm-backdrop">
    <div class="ear-fs-confirm-card">
      <div class="ear-fs-confirm-title">End recording?</div>
      <label class="ear-fs-complete-row" id="ear-fs-complete-label">
        <div class="ear-fs-complete-box" id="ear-fs-complete-box"></div>
        <span class="ear-fs-complete-text">Mark this interview as complete</span>
      </label>
      <div class="ear-fs-confirm-btns">
        <button class="ear-fs-confirm-btn ear-fs-confirm-cancel" id="ear-fs-confirm-cancel">Cancel</button>
        <button class="ear-fs-confirm-btn ear-fs-confirm-ok" id="ear-fs-confirm-ok">End Session</button>
      </div>
    </div>
  </div>

  <!-- Cancel session confirmation dialog -->
  <div class="ear-fs-confirm-backdrop" id="ear-fs-cancel-backdrop">
    <div class="ear-fs-confirm-card">
      <div class="ear-fs-confirm-title">Are you sure? This session will not be saved.</div>
      <div class="ear-fs-confirm-btns">
        <button class="ear-fs-confirm-btn ear-fs-confirm-cancel" id="ear-fs-cancel-no">Keep Going</button>
        <button class="ear-fs-confirm-btn ear-fs-confirm-discard" id="ear-fs-cancel-yes">Discard Session</button>
      </div>
    </div>
  </div>

  <script src="js/overlay.js"></script>
</body>
</html>
